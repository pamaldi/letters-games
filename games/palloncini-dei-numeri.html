<style>
/* Layout: a sunny sky with a few balloons in a row, the puppy on the grass, progress balloons in the top bar */
:root {
  color-scheme: light;
  --ink: #2a2233;
  --ink-dim: #5f5870;
  --line: #cfdcea;
  --gold: #f5b700;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --b: min(20vw, 26vh, 150px);
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: #cfeeff; color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; user-select: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 3px; }

.app { display: flex; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255, 255, 255, .85); border-bottom: 2px solid var(--line); z-index: 5; }
.icon-btn { display: grid; place-items: center; width: 48px; height: 48px; flex: none; border: 2px solid var(--line); border-radius: 14px; background: #fff; font-size: 24px; text-decoration: none; cursor: pointer; }
.icon-btn:active { transform: scale(.94); }
.title { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 3.4vw, 26px); white-space: nowrap; }
.progress { display: flex; gap: 4px; margin-left: auto; }
.progress span { width: clamp(14px, 2.8vw, 22px); height: clamp(18px, 3.5vw, 28px); border-radius: 50% 50% 46% 46%; border: 2px dashed #9fb3c8; transition: background .3s, transform .3s; }
.progress span.on { background: var(--c); border: 2px solid var(--ink); transform: scale(1.1); }

.sky { position: relative; flex: 1; min-height: 0; overflow: hidden; background: linear-gradient(180deg, #8fd3ff 0%, #cfeeff 60%, #e9f8ff 100%); }
.sun { position: absolute; right: 6%; top: 6%; width: 12vmin; aspect-ratio: 1; border-radius: 50%; background: #ffd84d; box-shadow: 0 0 0 10px rgba(255, 216, 77, .3), 0 0 40px rgba(255, 200, 0, .5); }
.cloud { position: absolute; width: 22vmin; height: 7vmin; border-radius: 99px; background: #fff; opacity: .9; animation: drift 40s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: #fff; }
.cloud::before { width: 9vmin; height: 9vmin; left: 18%; top: -4.5vmin; }
.cloud::after { width: 7vmin; height: 7vmin; left: 50%; top: -3vmin; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(110vw); } }
.grass { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; background: linear-gradient(180deg, #7ccf63, #4fa83c); border-top-left-radius: 50% 30%; border-top-right-radius: 50% 30%; }

.balloons { position: absolute; left: 0; right: 0; top: 8%; bottom: 16%; display: flex; justify-content: space-evenly; align-items: center; padding: 0 2%; }
.balloon { position: relative; width: var(--b); height: calc(var(--b) * 1.9); padding: 0; border: 0; background: none; cursor: pointer; animation: arrive .7s cubic-bezier(.2, .9, .3, 1.2) both, bob 3s ease-in-out infinite; animation-delay: var(--d), calc(var(--d) + .7s); }
.balloon svg { width: 100%; height: 100%; overflow: visible; }
.balloon .body { fill: var(--c); }
.balloon .num { font: 700 46px var(--font-display); fill: #fff; stroke: #2a2233; stroke-width: 6px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; }
.bunch { position: relative; display: flex; flex-direction: column; align-items: center; padding: 10px 10px 0; border: 3px solid transparent; border-radius: 24px; background: rgba(255, 255, 255, .28); cursor: pointer; animation: arrive .7s cubic-bezier(.2, .9, .3, 1.2) both, bob 3.4s ease-in-out infinite; animation-delay: var(--d), calc(var(--d) + .7s); }
.bunch:hover { border-color: rgba(255, 255, 255, .8); }
.bunch .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--sb)); gap: 4px 6px; }
.mini-balloon { position: relative; width: var(--sb); height: calc(var(--sb) * 1.25); }
.mini-balloon svg { width: 100%; height: 100%; overflow: visible; }
.mini-balloon .body { fill: var(--c); }
.mini-balloon .n { position: absolute; left: 50%; top: 40%; translate: -50% -50%; font: 700 calc(var(--sb) * .5) var(--font-display); color: #fff; -webkit-text-stroke: 1.5px #2a2233; paint-order: stroke fill; scale: 0; transition: scale .25s cubic-bezier(.3, 1.6, .5, 1); }
.mini-balloon.counted .n { scale: 1; }
.bunch .tie { width: 60%; height: calc(var(--sb) * 1.1); }
.bunch.wrong { animation: wrong .5s; }
.bunch.chosen { border-color: #fff; background: rgba(255, 255, 255, .55); animation: none; }
.bunch.away { animation: away 1.2s ease-in forwards; pointer-events: none; }
.balloons.bunches { flex-wrap: wrap; gap: 3vmin; align-content: center; --sb: min(6vw, 7vh, 46px); }
@media (max-width: 640px) { .balloons.bunches { flex-direction: column; flex-wrap: nowrap; gap: 10px; top: 4%; bottom: 15%; --sb: min(9vw, 4.6vh, 40px); } .bunch .tie { height: calc(var(--sb) * .6); } }
.word { box-shadow: 0 6px 20px rgba(0, 0, 0, .15); }
@keyframes arrive { from { transform: translateY(70vh); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-5%) rotate(var(--tilt, 3deg)); } }
.balloon.wrong { animation: wrong .5s; }
@keyframes wrong { 20%, 60% { transform: rotate(-12deg); } 40%, 80% { transform: rotate(12deg); } }
.balloon.popped { animation: popped .35s ease-out forwards; pointer-events: none; }
@keyframes popped { 40% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
.balloon.away { animation: away 1.2s ease-in forwards; pointer-events: none; }
@keyframes away { to { transform: translateY(-110vh) rotate(-8deg); } }

.word { position: absolute; left: 50%; top: 42%; translate: -50% -50%; padding: 6px 26px 10px; border-radius: 26px; background: #fff; border: 4px solid var(--c); color: var(--ink); font: 700 clamp(40px, 9vh, 80px) var(--font-display); opacity: 0; transform: scale(.5); transition: opacity .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; z-index: 4; }
.word.show { opacity: 1; transform: none; }

.pup { position: absolute; left: 4%; bottom: 6%; width: min(16vw, 18vh, 130px); z-index: 3; }
.pup svg { width: 100%; height: auto; overflow: visible; }
.pup .tailwag { transform-box: fill-box; transform-origin: 0% 100%; animation: wag .5s ease-in-out infinite alternate; }
@keyframes wag { to { transform: rotate(-25deg); } }
.pup.party { animation: hop .45s ease-out 2; }
@keyframes hop { 50% { transform: translateY(-35%); } }
.woof { position: absolute; left: 70%; bottom: 95%; padding: 4px 10px; border-radius: 14px 14px 14px 2px; background: #fff; font: 700 clamp(14px, 2.6vw, 20px) var(--font-display); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.pup.party .woof { opacity: 1; transform: none; }

.confetti { position: absolute; width: 14px; height: 10px; border-radius: 3px; pointer-events: none; z-index: 4; animation: burst 1s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(400deg); opacity: 0; } }

@media (max-width: 640px) { .title { display: none; } :root { --b: min(22vw, 24vh, 150px); } }

.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(20, 40, 60, .45); z-index: 10; }
.card { max-width: 460px; width: 100%; padding: 26px 24px; border-radius: 26px; background: #fffdf6; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.card h1, .card h2 { font-family: var(--font-display); margin: 0 0 8px; font-size: clamp(28px, 6vw, 38px); }
.card p { margin: 0 0 18px; color: var(--ink-dim); line-height: 1.5; font-size: 17px; }
.go { min-height: 60px; padding: 12px 32px; border: 0; border-radius: 18px; background: var(--gold); color: var(--ink); font: 700 24px var(--font-display); cursor: pointer; box-shadow: 0 5px 0 #b88a00; }
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #b88a00; }
.hero-b { font-size: 44px; margin-bottom: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

let actx = null, clipsReady = Promise.resolve(), voiceToken = 0, current = null;
const clipBuffers = {};

    try { const bin = Uint8Array.from(atob(url.split(',')[1]), c => c.charCodeAt(0)); clipBuffers[key] = await actx.decodeAudioData(bin.buffer); }

}

}

  const buf = clipBuffers[key];

function showProgress() {
  [...$('progress').children].forEach((s, i) => { s.classList.toggle('on', i < roundIdx); if (i < roundIdx) s.style.setProperty('--c', MODE === 'numbers' ? '#f5b700' : byName[order[i]].hex); });
}
function shuffle(list) { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Few balloons for a beginner: 3 at first, then 4, then 5.
const howMany = () => MODE === 'numbers' ? (roundIdx < 3 ? 2 : 3) : roundIdx < 3 ? 3 : roundIdx < 6 ? 4 : 5;
const MINI = `<svg viewBox="0 0 100 125" aria-hidden="true">
  <path d="M50 106 L50 125" stroke="#6b6b7b" stroke-width="3"/>
  <path class="body" d="M44 106 L56 106 L50 98Z" stroke="#2a2233" stroke-width="4" stroke-linejoin="round"/>
  <path class="body" d="M50 4 C80 4 96 30 94 52 C92 78 70 98 50 100 C30 98 8 78 6 52 C4 30 20 4 50 4Z" stroke="#2a2233" stroke-width="5"/>
  <ellipse cx="32" cy="32" rx="9" ry="15" fill="#fff" opacity=".45" transform="rotate(25 32 32)"/>
</svg>`;
// Number mode: bunches of balloons to count; early rounds keep the other bunches clearly different.
function placeBunches() {
  let others = ITEMS.filter(n => n !== target && (roundIdx >= 5 || Math.abs(n - target) >= 2));
  others = shuffle(others).slice(0, howMany() - 1);
  const counts = shuffle([target, ...others]);
  const box = $('balloons'); box.innerHTML = ''; box.classList.add('bunches');
  const paint = shuffle(COLOURS.filter(c => c.name !== 'white' && c.name !== 'black'));
  counts.forEach((k, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'bunch'; b.dataset.item = k;
    b.setAttribute('aria-label', 'mazzo di palloncini');
    b.style.setProperty('--d', (i * .12) + 's');
    b.style.setProperty('--tilt', (i % 2 ? -2 : 2) + 'deg');
    b.style.setProperty('--cols', Math.min(k, 5));
    const hex = paint[i].hex;
    let html = '<div class="grid">';
    for (let j = 0; j < k; j++) html += `<span class="mini-balloon" style="--c:${hex}">${MINI}<b class="n">${j + 1}</b></span>`;
    html += '</div><svg class="tie" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="M5 0 L50 32 M30 0 L50 32 M50 0 L50 32 M70 0 L50 32 M95 0 L50 32" stroke="#6b6b7b" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/><path d="M42 30 L58 30 L50 40Z" fill="#e5484d"/></svg>';
    b.innerHTML = html;
    b.addEventListener('click', () => choose(k, b));
    box.appendChild(b);
  });
}
function placeBalloons() {
  if (MODE === 'numbers') { placeBunches(); return; }
  const others = shuffle(ITEMS.filter(n => n !== target)).slice(0, howMany() - 1);
  const names = shuffle([target, ...others]);
  const paint = shuffle(COLOURS.filter(c => c.name !== 'white' && c.name !== 'black'));
  const box = $('balloons'); box.innerHTML = '';
  names.forEach((name, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'balloon'; b.dataset.item = name;
    b.setAttribute('aria-label', 'palloncino');
    b.style.setProperty('--c', MODE === 'numbers' ? paint[i].hex : byName[name].hex);
    b.style.setProperty('--d', (i * .12) + 's');
    b.style.setProperty('--tilt', (i % 2 ? -3 : 3) + 'deg');
    b.style.marginTop = (i % 2 ? 6 : -6) + '%';
    b.innerHTML = MODE === 'numbers' ? BALLOON.replace('</svg>', `<text class="num" x="50" y="56">${name}</text></svg>`) : BALLOON;
    b.addEventListener('click', () => choose(name, b));
    box.appendChild(b);
  });
}
function retrigger(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
function confetti(el, hex) {
  const s = $('sky').getBoundingClientRect(), r = el.getBoundingClientRect();
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = r.left + r.width / 2 - s.left + 'px'; c.style.top = r.top + r.height * .28 - s.top + 'px';
    c.style.background = i % 3 ? hex : '#fff';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 140;
    c.style.setProperty('--dx', Math.cos(a) * d + 'px'); c.style.setProperty('--dy', Math.sin(a) * d + 'px');
    $('sky').appendChild(c); setTimeout(() => c.remove(), 1100);
  }
}

/* ---------- flow ---------- */
function askVoice() { return say([askKey(target)]); }
async function startRound() {
  const token = ++roundToken;
  target = order[roundIdx];
  phase = 'ask';
  $('word').classList.remove('show');
  placeBalloons();
  await wait(700);
  if (token !== roundToken) return;
  askVoice();
}
async function choose(name, el) {
  ensureAudio();
  if (phase !== 'ask') return;
  if (name !== target) {
    retrigger(el, 'wrong', 500); boing();
    say(['oops', askKey(target)]);
    return;
  }
  const token = roundToken;
  phase = 'right';
  if (MODE === 'numbers') {
    const token = roundToken;
    phase = 'right';
    el.classList.add('chosen');
    retrigger($('pup'), 'party', 1000); setTimeout(woof, 300 * speed);
    roundIdx++; showProgress();
    say(['great']);
    const minis = [...el.querySelectorAll('.mini-balloon')];
    for (const m of minis) { m.classList.add('counted'); tone('triangle', 500 + 50 * minis.indexOf(m), 900, .1, .08); await wait(220); }
    const w = $('word'); w.textContent = wordOf(name); w.style.setProperty('--c', '#f5b700'); w.classList.add('show');
    confetti(el, '#f5b700');
    await wait(1400);
    if (token !== roundToken) return;
    [...$('balloons').children].forEach(b => b.classList.add('away'));
    $('word').classList.remove('show');
    await wait(900);
    if (token !== roundToken) return;
    if (roundIdx >= order.length) finish(); else startRound();
    return;
  }
  const hex = getComputedStyle(el).getPropertyValue('--c').trim();
  el.classList.add('popped'); popSound(); confetti(el, hex === '#ffffff' ? '#f5b700' : hex);
  const w = $('word'); w.textContent = wordOf(name); w.style.setProperty('--c', hex); w.classList.add('show');
  retrigger($('pup'), 'party', 1000); setTimeout(woof, 300 * speed);
  roundIdx++; showProgress();
  await say(['great']);
  await wait(700);
  if (token !== roundToken) return;
  [...$('balloons').children].forEach(b => { if (b !== el) b.classList.add('away'); });
  $('word').classList.remove('show');
  await wait(900);
  if (token !== roundToken) return;
  if (roundIdx >= order.length) finish(); else startRound();
}
function finish() {
  phase = 'done';
  $('ov-win').hidden = false;
  retrigger($('pup'), 'party', 1000); woof();
  say(['win', 'hero']);
}
async function begin() {
  ensureAudio();
  $('ov-start').hidden = true; $('ov-win').hidden = true;
  order = shuffle(ITEMS); roundIdx = 0; showProgress();
  const token = ++roundToken; phase = 'intro';
  await clipsReady;
  await say(['hello']);
  if (token === roundToken) startRound();
}
$('start').addEventListener('click', begin);
$('again').addEventListener('click', begin);
$('repeat').addEventListener('click', () => { ensureAudio(); if (phase === 'ask') askVoice(); });
})();
</script>
</body>
</html>
